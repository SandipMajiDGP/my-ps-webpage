<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Manager Login</title>
    <link rel="stylesheet" href="/psm/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/psm/static/icons/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            margin: 40px auto;
            padding: 2.5rem 2rem 2rem 2rem;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 32px 0 rgba(37, 150, 190, 0.10);
            border: 1.5px solid #e3eaf1;
        }
        .login-container h3 {
            font-weight: 700;
            letter-spacing: 1px;
            color: #2596be;
            margin-bottom: 2rem;
        }
        .form-label {
            color: #2596be;
            font-weight: 500;
        }
        .form-control {
            border-radius: 12px;
            border: 1px solid #ced4da;
            background: #f8f9fa;
            color: #222;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: #2596be;
            box-shadow: 0 0 0 0.2rem rgba(37,150,190,0.10);
            background: #fff;
            color: #222;
        }
        .btn-primary {
            background-color: #2596be;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            transition: box-shadow 0.2s, transform 0.2s;
            box-shadow: 0 2px 8px 0 rgba(37,150,190,0.10);
        }
        .btn-primary:hover {
            background-color: #2286aa;
            box-shadow: 0 4px 16px 0 rgba(37,150,190,0.18);
            transform: translateY(-2px) scale(1.04);
        }
        #loginError {
            color: #dc3545;
            font-weight: 500;
            text-align: center;
        }
        @media (max-width: 600px) {
            .login-container { padding: 1.2rem 0.5rem; }
            .login-container h3 { font-size: 1.5rem; }
        }
        .modal-body-cnt {
            white-space: pre-wrap; 
            max-height: 400px; 
            padding: 15px;
            font-size: 1rem; 
            color: #333;
            line-height: 1.5; 
        }
        .modal-content {
            background-color: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .modal-header {
            background-color: #f8f9fa;
            color: #2596be;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
        }
        .modal-title {
            color: #2596be;
        }
        .modal-footer {
            background-color: #f8f9fa;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
        }
        .table thead th {
            position: sticky;
            top: 0;
            z-index: 1;
            background-color: #2596be;  
            color: white;               
            font-weight: bold;
            text-align: center;
            padding: 10px 15px;
        }
        .table {
            width: 100%;
        }
        .table-btn {
            display: flex;
            justify-content: center;
            gap: 10px; 
        }
        .btn-add-entry {
            background-color: #2596be;
            border-color: #2596be;
            color: #fff;
            border-radius: 30px;
            font-weight: 500;
        }
        .btn-add-entry:hover {
            background-color:  #2286aa;
            border-color: #2286aa;
            color: #fff; 
        }
        .btn-view-note {
            background-color: #2596be;
            color: #fff;
            font-weight: 500;
            border: none;
            border-radius: 50px; 
            padding: 4px 14px;
            font-size: 0.875rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-view-note:hover {
            background-color:  #2286aa;
            color: #fff;
        }
        .btn-edit {
            background-color: #2596be;
            color: #fff;
            font-weight: 500;
            border: none;
            border-radius: 50px; 
            padding: 4px 14px;
            font-size: 0.875rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-edit:hover {
            background-color:  #2286aa;
            color: #fff;
        }
        .btn-delete {
            background-color: #dc3545;
            color: #fff;
            font-weight: 500;
            border: none;
            border-radius: 50px; 
            padding: 4px 14px;
            font-size: 0.875rem;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
        .btn-delete:hover {
            background-color:  #c32232;
            color: #fff;
        }
        .btn-save-clean {
            background-color: #cce6ff;
            color: #0d3c61;
            font-weight: 600;
            border-radius: 6px;
            padding: 8px 16px;
            font-size: 1rem;
            letter-spacing: 0.4px;
            cursor: pointer;
            min-width: 100px;
            display: inline-block;
            text-align: center;
            line-height: 1.5;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
            transition: box-shadow 0.25s ease, transform 0.1s ease;
        }
        .btn-save-clean:hover {
            background-color: #e6f3ff;
        }
        .table-responsive {
            max-height: 400px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }
        .table thead th.sticky-col {
            position: sticky;
            left: 0; 
            z-index: 2;  
            background-color: #2596be;   
        }
        @media (max-width: 576px) {
            .table th, .table td {
                white-space: nowrap;
                font-size: 0.85rem;
                padding: 8px;
            }
        }
        .btn-toggle-password {
            background: none;
            border: none;
            color: #2596be;
            padding: 0;
            font-size: 1rem;
        }
        .btn-toggle-password:hover {
            color: #0b5ed7;
        }
        .password {
            padding-right: 2.5rem; 
        }
        .togglePassword {
            font-size: 1.2rem;
            z-index: 10;
        }
        .togglePassword:hover {
            color: #2596be;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h3 class="mb-4 text-center">Password Manager</h3>
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <div id="loginError" class="text-danger mt-3" style="display:none;"></div>
        </form>
    </div>
    <script src="/psm/static/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const res = await fetch('/psm/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();
            if (res.ok && data.token) {
                sessionStorage.setItem('token', data.token);
                // Always redirect to dashboard, regardless of role
                window.location.href = '/psm/dashboard';
            } else {
                document.getElementById('loginError').innerText = data.error || 'Login failed';
                document.getElementById('loginError').style.display = 'block';
            }
        });
    </script>
</body>
</html>
